name: insta_downloader
description: InstaDownloader - Download Anything Fast & Free
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/json/app_strings.json
    - assets/images/home_dark.png
    - assets/images/home_light.png
    - assets/images/platforms/
